<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Detroit Sports Hub</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    
    <img src="DZoneLogo.png" id="mainLogo" class="main-Logo">

    <div class="logo-grid">
        <img src="lionsLogo.png" id="lions" class="team-logo">
